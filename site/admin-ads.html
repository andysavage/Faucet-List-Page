<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Management - Faucet List</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }

        h1,
        h2 {
            color: #2ea2cc;
        }

        .section {
            background: #f7f7f7;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .ad-list {
            list-style: none;
            padding: 0;
        }

        .ad-item {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 3px;
            position: relative;
        }

        .ad-content {
            margin-bottom: 10px;
            overflow-x: auto;
            background: #fafafa;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            float: right;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .edit-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            float: right;
            margin-right: 5px;
        }

        .edit-btn:hover {
            background: #0056b3;
        }

        .editing-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }

        .cancel-btn:hover {
            background: #545b62;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .button-primary {
            background: #2ea2cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
        }

        .button-primary:hover {
            background: #1e8cbe;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #eee;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
        }

        .tab.active {
            background: #f7f7f7;
            border: 1px solid #ddd;
            border-bottom: none;
            font-weight: bold;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .mode-toggle {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-option {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .mode-option:hover {
            border-color: #2ea2cc;
        }

        .mode-option:has(input:checked) {
            border-color: #2ea2cc;
            background: #e8f4f8;
        }

        .mode-option input[type="radio"] {
            margin-right: 8px;
        }

        .mode-option span {
            font-weight: bold;
        }

        .mode-option small {
            display: block;
            margin-top: 5px;
            margin-left: 22px;
            color: #666;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="url"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }

        .upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-row input[type="file"] {
            flex: 1;
            min-width: 200px;
        }

        .upload-result {
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 3px;
            display: none;
            font-size: 13px;
        }

        .upload-result.error {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
    </style>
</head>

<body>
    <h1>Ad Management</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('banner')">Banners (Top/Right)</div>
        <div class="tab" onclick="switchTab('floating')">Floating Ads (Bottom-Left)</div>
    </div>

    <div class="section">
        <div id="ad-container" class="ad-list">
            Loading ads...
        </div>
    </div>

    <div class="section">
        <h2 id="form-title">Add New Banner Ad</h2>
        <div id="editing-notice" class="editing-notice" style="display: none;">
            ✏️ Editing ad #<span id="editing-index"></span> - <a href="#" onclick="cancelEdit(); return false;">Cancel</a>
        </div>

        <div class="mode-toggle">
            <label class="mode-option">
                <input type="radio" name="ad-mode" value="simple" checked onchange="switchMode('simple')">
                <span>📷 Simple Image Ad</span>
                <small>Upload image + enter link URL</small>
            </label>
            <label class="mode-option">
                <input type="radio" name="ad-mode" value="custom" onchange="switchMode('custom')">
                <span>📝 Custom Code</span>
                <small>Paste HTML/JS snippet (e.g. a-ads.com)</small>
            </label>
        </div>

        <form id="add-ad-form">
            <!-- Simple Image Ad Mode -->
            <div id="simple-mode">
                <div class="form-group">
                    <label for="banner-file">Banner Image (upload):</label>
                    <div class="upload-row">
                        <input type="file" id="banner-file" accept="image/jpeg,image/png,image/gif,image/webp">
                        <button type="button" class="button-primary" onclick="uploadBanner()">Upload</button>
                    </div>
                    <div id="upload-result" class="upload-result">
                        <strong>✓ Uploaded:</strong> <span id="uploaded-url"></span>
                    </div>
                </div>
                <div class="or-divider" style="text-align: center; margin: 15px 0; color: #888; font-style: italic;">— OR —</div>
                <div class="form-group">
                    <label for="image-url">Banner Image (URL):</label>
                    <input type="url" id="image-url" placeholder="https://example.com/image.png">
                </div>
                <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
                <div class="form-group">
                    <label for="link-url">Link URL (where ad clicks go):</label>
                    <input type="url" id="link-url" placeholder="https://example.com/landing-page">
                </div>
            </div>

            <!-- Custom Code Mode -->
            <div id="custom-mode" style="display: none;">
                <div class="form-group">
                    <label for="ad-html">HTML/JavaScript Code:</label>
                    <textarea id="ad-html" placeholder="Paste your ad code here (HTML, JavaScript, etc.)..."></textarea>
                </div>
            </div>

            <button type="submit" class="button-primary" id="submit-btn">Add Banner Ad</button>
            <button type="button" class="cancel-btn" id="cancel-btn" style="display: none;" onclick="cancelEdit()">Cancel Edit</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentType = 'banner';
        let currentMode = 'simple';  // 'simple' or 'custom'
        let editingIndex = -1;  // -1 means adding new, >= 0 means editing that index

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'simple') {
                $('#simple-mode').show();
                $('#custom-mode').hide();
            } else {
                $('#simple-mode').hide();
                $('#custom-mode').show();
            }
        }

        function switchTab(type) {
            currentType = type;
            $('.tab').removeClass('active');
            $(`.tab:contains(${type === 'banner' ? 'Banners' : 'Floating'})`).addClass('active');
            $('#form-title').text(`Add New ${type === 'banner' ? 'Banner' : 'Floating'} Ad`);
            $('#submit-btn').text(`Add ${type === 'banner' ? 'Banner' : 'Floating'} Ad`);
            loadAds();
        }

        // Protect page - verify admin status upfront
        async function checkAdmin() {
            const session = auth.getSession();
            if (!session) {
                auth.login();
                return;
            }

            // Verify admin status with server before showing interface
            try {
                const response = await fetch(`api/get-banner-ads.php?type=banner&user_id=${session.combined_user_id}`);
                if (response.status === 403) {
                    document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>Access Denied</h1><p>Admin privileges required.</p><p><a href="/">Return to Faucet List</a></p></div>';
                    return;
                }
                loadAds();
            } catch (error) {
                document.body.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>Error</h1><p>Could not verify admin status.</p></div>';
            }
        }

        async function loadAds() {
            $('#ad-container').html('Loading ads...');
            const session = auth.getSession();
            if (!session) return;

            try {
                const response = await fetch(`api/get-banner-ads.php?type=${currentType}&user_id=${session.combined_user_id}&t=${Date.now()}`);
                const data = await response.json();

                if (data.success && data.ads.length > 0) {
                    let html = '';
                    data.ads.forEach((ad, index) => {
                    html += `
                            <div class="ad-item clearfix" data-index="${index}">
                                <button class="delete-btn" onclick="deleteAd(${index})">Delete</button>
                                <button class="edit-btn" data-index="${index}">Edit</button>
                                <div class="ad-content">${escapeHtml(ad)}</div>
                                <div class="ad-preview" style="${currentType === 'floating' ? 'width: 250px;' : ''} transform: scale(0.5); transform-origin: top left; height: 100px; overflow: hidden; border: 1px solid #ddd;">
                                    ${ad}
                                </div>
                            </div>
                        `;
                    // Store raw ad HTML for editing
                    window.adContents = window.adContents || [];
                    window.adContents[index] = ad;
                    });
                    $('#ad-container').html(html);
                } else {
                    $('#ad-container').html(`<p>No ${currentType} ads configured.</p>`);
                }
            } catch (error) {
                $('#ad-container').html('<p style="color:red">Error loading ads. Admin privileges required.</p>');
                console.error(error);
            }
        }

        async function deleteAd(index) {
            if (!confirm(`Are you sure you want to delete this ${currentType} ad?`)) return;
            const session = auth.getSession();

            try {
                const response = await fetch('api/delete-banner-ad.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: session.combined_user_id,
                        index: index,
                        type: currentType
                    })
                });
                const result = await response.json();
                if (result.success) {
                    loadAds();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Connection error');
                console.error(error);
            }
        }

        // Delegate click handler for edit buttons
        $(document).on('click', '.edit-btn', function() {
            const index = $(this).data('index');
            editAd(index);
        });

        function editAd(index) {
            editingIndex = index;
            const adContent = window.adContents[index] || '';
            
            // Switch to custom mode for editing (existing ads are raw HTML)
            $('input[name="ad-mode"][value="custom"]').prop('checked', true);
            switchMode('custom');
            $('#ad-html').val(adContent);
            
            $('#form-title').text(`Edit ${currentType === 'banner' ? 'Banner' : 'Floating'} Ad`);
            $('#submit-btn').text('Save Changes');
            $('#cancel-btn').show();
            $('#editing-notice').show();
            $('#editing-index').text(index + 1);
            // Scroll to form
            document.getElementById('add-ad-form').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editingIndex = -1;
            // Reset form fields
            $('#ad-html').val('');
            $('#link-url').val('');
            $('#image-url').val('');
            $('#upload-result').hide();
            lastUploadedUrl = '';
            // Reset to simple mode
            $('input[name="ad-mode"][value="simple"]').prop('checked', true);
            switchMode('simple');
            // Update UI
            $('#form-title').text(`Add New ${currentType === 'banner' ? 'Banner' : 'Floating'} Ad`);
            $('#submit-btn').text(`Add ${currentType === 'banner' ? 'Banner' : 'Floating'} Ad`);
            $('#cancel-btn').hide();
            $('#editing-notice').hide();
        }

        $('#add-ad-form').on('submit', async function (e) {
            e.preventDefault();
            const session = auth.getSession();
            let html;

            if (currentMode === 'simple') {
                // Generate HTML from image URL and link
                const imageUrl = lastUploadedUrl || $('#image-url').val().trim();
                if (!imageUrl) {
                    alert('Please upload an image or enter an image URL');
                    return;
                }
                const linkUrl = $('#link-url').val().trim();
                if (linkUrl) {
                    html = `<a href="${linkUrl}" target="_blank" rel="noopener"><img src="${imageUrl}" alt="Advertisement" style="max-width:100%;"></a>`;
                } else {
                    html = `<img src="${imageUrl}" alt="Advertisement" style="max-width:100%;">`;
                }
            } else {
                // Custom code mode
                html = $('#ad-html').val().trim();
                if (!html) {
                    alert('Please enter ad code');
                    return;
                }
            }

            const payload = {
                user_id: session.combined_user_id,
                html: html,
                type: currentType
            };
            
            // Include index if editing
            if (editingIndex >= 0) {
                payload.index = editingIndex;
            }

            try {
                const response = await fetch('api/save-banner-ad.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.success) {
                    cancelEdit();  // Reset form state
                    loadAds();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Connection error');
                console.error(error);
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let lastUploadedUrl = '';

        async function uploadBanner() {
            const fileInput = document.getElementById('banner-file');
            const resultDiv = document.getElementById('upload-result');
            const urlDiv = document.getElementById('uploaded-url');

            if (!fileInput.files || !fileInput.files[0]) {
                alert('Please select a file first');
                return;
            }

            const session = auth.getSession();
            if (!session) {
                alert('Please sign in first');
                return;
            }

            const formData = new FormData();
            formData.append('banner', fileInput.files[0]);
            formData.append('user_id', session.combined_user_id);

            try {
                resultDiv.style.display = 'none';
                resultDiv.className = 'upload-result';

                const response = await fetch('api/upload-banner.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    lastUploadedUrl = result.url;
                    urlDiv.textContent = result.url;
                    resultDiv.style.display = 'block';
                    fileInput.value = '';
                } else {
                    resultDiv.className = 'upload-result error';
                    urlDiv.textContent = 'Error: ' + result.error;
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                resultDiv.className = 'upload-result error';
                urlDiv.textContent = 'Upload failed: ' + error.message;
                resultDiv.style.display = 'block';
            }
        }

        // Initial check
        $(document).ready(() => checkAdmin());
    </script>
</body>

</html>
