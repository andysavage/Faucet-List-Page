<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faucet List – Track Your Crypto Faucets</title>
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);
            color: #fff;
            text-align: center;
            padding: 15px;
        }
        .tagline {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        h1 {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .phrases {
            height: 24px;
            margin-bottom: 25px;
            font-size: 16px;
            opacity: 0.9;
        }
        .phrase {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .phrase.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cta {
            display: inline-block;
            padding: 14px 40px;
            background: #28a745;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.5);
        }
        .sub {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="tagline">Free tool for crypto earners</div>
    <h1>Faucet List</h1>
    <div class="phrases">
        <div class="phrase active">Track all your faucet timers</div>
        <div class="phrase">Never miss a claim again</div>
        <div class="phrase">Easily double your income</div>
    </div>
    <a href="/" class="cta">Start Tracking</a>
    <div class="sub">No account required</div>
    <script>
        (function() {
            var phrases = document.querySelectorAll('.phrase');
            var i = 0;
            setInterval(function() {
                phrases[i].classList.remove('active');
                i = (i + 1) % phrases.length;
                phrases[i].classList.add('active');
            }, 3000);
        })();
    </script>
</body>
</html>
