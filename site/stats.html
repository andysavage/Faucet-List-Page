<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .nav-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .nav-button:hover {
            background: #764ba2;
        }
        .period-selector {
            display: flex;
            gap: 10px;
        }
        .period-btn {
            background: #e2e8f0;
            color: #2d3748;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }
        .period-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .period-btn:hover {
            border-color: #667eea;
        }
        .date-display {
            color: #718096;
            font-size: 0.95em;
            min-width: 200px;
        }
        .loading {
            display: none;
            color: #667eea;
            font-size: 0.9em;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
        }
        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
        }
        .chart-container h2 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .table-container {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
        }
        .table-container h2 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:hover {
            background: #edf2f7;
        }
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #718096;
        }
        .footer {
            text-align: center;
            color: #718096;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Analytics</h1>
            <div class="nav-controls">
                <button class="nav-button" id="prevBtn">◀ Previous</button>
                <div class="period-selector">
                    <button class="period-btn active" data-period="day">Today</button>
                    <button class="period-btn" data-period="week">Week</button>
                    <button class="period-btn" data-period="month">Month</button>
                </div>
                <button class="nav-button" id="nextBtn">Next ▶</button>
                <span class="date-display" id="dateDisplay"></span>
                <span class="loading" id="loadingIndicator">Loading...</span>
            </div>
        </div>

        <div class="metrics-grid" id="metricsGrid">
            <div class="metric-card"><div class="metric-label">Visitors</div><div class="metric-value" id="visitorCount">0</div></div>
            <div class="metric-card"><div class="metric-label">Pageviews</div><div class="metric-value" id="pageviewCount">0</div></div>
            <div class="metric-card"><div class="metric-label">Avg. per Day</div><div class="metric-value" id="avgPerDay">0</div></div>
            <div class="metric-card"><div class="metric-label">Bandwidth</div><div class="metric-value" id="bandwidth">0 MB</div></div>
        </div>

        <div class="chart-grid">
            <div class="chart-container">
                <h2>Traffic Trend</h2>
                <canvas id="trafficChart"></canvas>
            </div>
            <div class="chart-container">
                <h2>Top Pages</h2>
                <canvas id="pagesChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h2>Referrers</h2>
            <table id="referrersTable">
                <thead><tr><th>Source</th><th>Visits</th></tr></thead>
                <tbody id="referrersList"></tbody>
            </table>
        </div>

        <div class="table-container">
            <h2>Browsers</h2>
            <table id="browsersTable">
                <thead><tr><th>Browser</th><th>Visits</th></tr></thead>
                <tbody id="browsersList"></tbody>
            </table>
        </div>

        <div class="footer" id="footer"></div>
    </div>

    <script>
        class AnalyticsDashboard {
            constructor() {
                this.period = 'day';
                this.referenceDate = new Date();
                this.referenceDate.setHours(0, 0, 0, 0);
                this.allReports = {};
                this.charts = {};
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadData();
            }

            setupEventListeners() {
                document.getElementById('prevBtn').addEventListener('click', () => this.previousPeriod());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextPeriod());
                document.querySelectorAll('.period-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.changePeriod(e.target.dataset.period));
                });
            }

            async loadData() {
                this.showLoading(true);
                
                // Calculate date range to load
                const [startDate, endDate] = this.getDateRange();
                const datesToLoad = this.getDatesBetween(startDate, endDate);

                // Load all necessary JSON files
                for (const date of datesToLoad) {
                    const dateStr = date.toISOString().split('T')[0];
                    if (!this.allReports[dateStr]) {
                        await this.loadReportForDate(dateStr);
                    }
                }

                this.render();
                this.showLoading(false);
            }

            async loadReportForDate(dateStr) {
                try {
                    const response = await fetch(`../data/analytics/report-${dateStr}.json`);
                    if (response.ok) {
                        this.allReports[dateStr] = await response.json();
                    }
                } catch (e) {
                    console.log(`Report for ${dateStr} not available`);
                }
            }

            getDateRange() {
                const start = new Date(this.referenceDate);
                const end = new Date(this.referenceDate);

                if (this.period === 'day') {
                    return [start, end];
                } else if (this.period === 'week') {
                    const day = start.getDay();
                    start.setDate(start.getDate() - day);
                    end.setDate(end.getDate() + (6 - day));
                    return [start, end];
                } else if (this.period === 'month') {
                    start.setDate(1);
                    end.setMonth(end.getMonth() + 1);
                    end.setDate(0);
                    return [start, end];
                }
            }

            getDatesBetween(start, end) {
                const dates = [];
                const current = new Date(start);
                while (current <= end) {
                    dates.push(new Date(current));
                    current.setDate(current.getDate() + 1);
                }
                return dates;
            }

            aggregateData() {
                const [startDate, endDate] = this.getDateRange();
                const aggregated = {
                    summary: { visitors: 0, pageviews: 0, bandwidth_mb: 0 },
                    pages: {},
                    referrers: {},
                    browsers: {},
                    daily: {}
                };

                const datesToProcess = this.getDatesBetween(startDate, endDate);
                datesToProcess.forEach(date => {
                    const dateStr = date.toISOString().split('T')[0];
                    const report = this.allReports[dateStr];
                    if (!report) return;

                    aggregated.summary.visitors += report.summary.visitors;
                    aggregated.summary.pageviews += report.summary.pageviews;
                    aggregated.summary.bandwidth_mb += report.summary.bandwidth_mb;

                    aggregated.daily[dateStr] = report.summary;

                    report.pages.forEach(p => {
                        aggregated.pages[p.path] = (aggregated.pages[p.path] || 0) + p.views;
                    });
                    report.referrers.forEach(r => {
                        aggregated.referrers[r.source] = (aggregated.referrers[r.source] || 0) + r.visits;
                    });
                    report.browsers.forEach(b => {
                        aggregated.browsers[b.name] = (aggregated.browsers[b.name] || 0) + b.visits;
                    });
                });

                return aggregated;
            }

            render() {
                const data = this.aggregateData();
                this.updateMetrics(data);
                this.updateCharts(data);
                this.updateTables(data);
                this.updateDateDisplay();
            }

            updateMetrics(data) {
                const daysInPeriod = this.period === 'day' ? 1 : 
                                    this.period === 'week' ? 7 : 
                                    new Date(this.referenceDate.getFullYear(), this.referenceDate.getMonth() + 1, 0).getDate();

                document.getElementById('visitorCount').textContent = data.summary.visitors.toLocaleString();
                document.getElementById('pageviewCount').textContent = data.summary.pageviews.toLocaleString();
                document.getElementById('avgPerDay').textContent = Math.round(data.summary.pageviews / daysInPeriod).toLocaleString();
                document.getElementById('bandwidth').textContent = data.summary.bandwidth_mb.toFixed(1) + ' MB';
            }

            updateCharts(data) {
                this.updateTrafficChart(data);
                this.updatePagesChart(data);
            }

            updateTrafficChart(data) {
                const sortedDates = Object.keys(data.daily).sort();
                const visitors = sortedDates.map(d => data.daily[d].visitors);
                const pageviews = sortedDates.map(d => data.daily[d].pageviews);
                const labels = sortedDates.map(d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));

                const ctx = document.getElementById('trafficChart').getContext('2d');
                
                if (this.charts.traffic) {
                    this.charts.traffic.destroy();
                }

                this.charts.traffic = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Pageviews',
                                data: pageviews,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                tension: 0.4,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: true } }
                    }
                });
            }

            updatePagesChart(data) {
                const sorted = Object.entries(data.pages)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);
                
                const labels = sorted.map(p => p[0].substring(0, 30));
                const values = sorted.map(p => p[1]);

                const ctx = document.getElementById('pagesChart').getContext('2d');
                
                if (this.charts.pages) {
                    this.charts.pages.destroy();
                }

                this.charts.pages = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Views',
                            data: values,
                            backgroundColor: '#764ba2'
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        plugins: { legend: { display: false } }
                    }
                });
            }

            updateTables(data) {
                const referrersList = document.getElementById('referrersList');
                const browsersList = document.getElementById('browsersList');

                referrersList.innerHTML = Object.entries(data.referrers)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10)
                    .map(([source, visits]) => `<tr><td>${source}</td><td>${visits.toLocaleString()}</td></tr>`)
                    .join('');

                browsersList.innerHTML = Object.entries(data.browsers)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10)
                    .map(([browser, visits]) => `<tr><td>${browser}</td><td>${visits.toLocaleString()}</td></tr>`)
                    .join('');

                if (referrersList.innerHTML === '') {
                    referrersList.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #999;">No data</td></tr>';
                }
                if (browsersList.innerHTML === '') {
                    browsersList.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #999;">No data</td></tr>';
                }
            }

            updateDateDisplay() {
                const [start, end] = this.getDateRange();
                let display = '';
                
                if (this.period === 'day') {
                    display = start.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
                } else if (this.period === 'week') {
                    const startStr = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const endStr = end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    display = `${startStr} - ${endStr}`;
                } else if (this.period === 'month') {
                    display = start.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                }

                document.getElementById('dateDisplay').textContent = display;
            }

            changePeriod(period) {
                this.period = period;
                document.querySelectorAll('.period-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.period === period);
                });
                this.referenceDate = new Date();
                this.referenceDate.setHours(0, 0, 0, 0);
                this.loadData();
            }

            previousPeriod() {
                if (this.period === 'day') {
                    this.referenceDate.setDate(this.referenceDate.getDate() - 1);
                } else if (this.period === 'week') {
                    this.referenceDate.setDate(this.referenceDate.getDate() - 7);
                } else if (this.period === 'month') {
                    this.referenceDate.setMonth(this.referenceDate.getMonth() - 1);
                }
                this.loadData();
            }

            nextPeriod() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                let nextDate = new Date(this.referenceDate);
                if (this.period === 'day') {
                    nextDate.setDate(nextDate.getDate() + 1);
                } else if (this.period === 'week') {
                    nextDate.setDate(nextDate.getDate() + 7);
                } else if (this.period === 'month') {
                    nextDate.setMonth(nextDate.getMonth() + 1);
                }
                
                // Don't go beyond today
                const [, endDate] = this.getDateRange();
                if (endDate <= today) {
                    if (this.period === 'day') {
                        this.referenceDate.setDate(this.referenceDate.getDate() + 1);
                    } else if (this.period === 'week') {
                        this.referenceDate.setDate(this.referenceDate.getDate() + 7);
                    } else if (this.period === 'month') {
                        this.referenceDate.setMonth(this.referenceDate.getMonth() + 1);
                    }
                    this.loadData();
                }
            }

            showLoading(show) {
                document.getElementById('loadingIndicator').style.display = show ? 'inline' : 'none';
            }
        }

        // Initialize dashboard
        new AnalyticsDashboard();
    </script>
</body>
</html>
