<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatoshiHost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌐 SatoshiHost</h1>
        <p>Welcome to SatoshiHost. This server hosts various cryptocurrency and charitable projects.</p>
        <p>Check out our main project:</p>
        <a href="https://clickforcharity.net/">→ Click for Charity</a>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <h2 style="font-size: 1.5em; margin-bottom: 20px;">🛠️ Local Development</h2>
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <a href="/faucetlist.org/site/" style="background: #2d2d2d; font-size: 1em; padding: 12px 25px;">Faucet
                List</a>
            <a href="/clickforcharity.net/site/"
                style="background: #2d2d2d; font-size: 1em; padding: 12px 25px;">ClickForCharity</a>
        </div>
    </div>
</body>

</html>
